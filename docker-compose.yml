services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SPRING_PROFILES_ACTIVE: dev
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    depends_on:
      redis:
        condition: service_healthy
